# 红娘八字排盘 · paipan.locxai.com
# 由 deploy/install.sh 安装到 /etc/nginx/conf.d/paipan.locxai.com.conf
# 这是一个独立 server 块，不影响 console / app / api / www 任何现有站点。

server {
    listen 80;
    listen [::]:80;
    server_name paipan.locxai.com;

    # 证书签发与续期用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name paipan.locxai.com;

    ssl_certificate     /etc/letsencrypt/live/paipan.locxai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paipan.locxai.com/privkey.pem;

    # lunar.js 425KB，gzip 后 109KB，首屏主要成本就是它
    gzip on;
    gzip_types application/javascript application/json text/css text/plain;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
