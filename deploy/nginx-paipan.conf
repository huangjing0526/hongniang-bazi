# 红娘八字排盘 · paipan.locxai.com
# 由 deploy/install.sh 安装到 /etc/nginx/conf.d/paipan.locxai.com.conf
# 这是一个独立 server 块，不影响 console / app / api / www 任何现有站点。

server {
    listen 80;
    listen [::]:80;
    server_name paipan.locxai.com;

    # 证书签发与续期用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 与同机其他 vhost 保持一致的 pre-1.25 写法。这台 nginx 是 1.24，
    # 不认 `http2 on;`（1.25.1 才有）；而且同一 listen 地址上各 server 块的
    # 协议参数必须写法一致，否则 nginx 会报 "protocol options redefined"。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paipan.locxai.com;

    ssl_certificate     /etc/letsencrypt/live/paipan.locxai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paipan.locxai.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_locxai:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/paipan.access.log;
    error_log  /var/log/nginx/paipan.error.log;

    # lunar.js 425KB，gzip 后 109KB，首屏主要成本就是它
    gzip on;
    gzip_types application/javascript application/json text/css text/plain;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
